name: Canary

on:
  push:
    branches: [main]

concurrency:
  group: publish-canary
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      - name: Set canary version
        run: |
          BASE=$(node -p "require('./package.json').version.split(/[+-]/)[0]")
          COMMIT_DATE=$(git show -s --no-show-signature --format=%cd --date=format:%Y%m%d "$GITHUB_SHA")
          VERSION="$BASE-canary-${GITHUB_SHA::8}-$COMMIT_DATE"
          npm version "$VERSION" --no-git-tag-version --ignore-scripts

      - name: Check if this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish canary
        if: steps.check.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Set the NPM_TOKEN Actions secret to an npm token with publishing access to @pmndrs/klipp"
            exit 1
          fi
          npm publish --access public --tag canary --provenance
